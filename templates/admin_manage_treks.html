<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../static/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Welcome!</h2>

          <ul>
                <li><a href="{{url_for('admin_dash')}}"><i class="bi bi-house-fill"></i> Dashboard</a></li>
                <li><a href="{{url_for('admin_mng_trek')}}"><i class="bi bi-signpost-split-fill"></i> Treks</a></li>
                <li><a href="{{url_for('admin_mng_staff')}}"><i class="bi bi-person-badge-fill"></i> Staff</a></li>
                <li><a href="{{url_for('admin_users')}}"><i class="bi bi-person-fill"></i>Users</a></li>
                <li><a href="{{url_for('admin_mng_bookings')}}"><i class="bi bi-calendar-check-fill"></i>Bookings</a></li>
                <li><i class="bi bi-search"></i> Search</li>
                <li><a href="{{url_for('signin')}}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main">

             <header>
                <h2>Trekking Management Application</h2>
                <div class="admin">
                    <i class="bi bi-person-gear"></i>
                     <span>Admin</span>
                </div>    
            </header>
            <!-- title -->
             <h2 class="title"><u>Treks</u></h2>

             <!-- Trek add button -->
             <div class="card">
                <a href="{{url_for('admin_modify')}}" class="btn-add-trek">+ Add New Trek</a>
             </div>

             <!-- table creation -->
             <div class="table-box">
             <table border="1">
                <tr>
                    <th>ID</th>
                    <th colspan="2">Trek Name</th>
                    <th>Location</th>
                    <th>Difficulty</th>
                    <th>Slots</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td colspan="2">Everest Base Camp</td>
                    <td>Nepal</td>
                    <td>Hard</td>
                    <td>110</td>
                    <td>Open</td>
                    <td>
                        <button type="submit">Remove</button>
                    </td>
                </tr>
             </table>
            </div> 
            
            
            
            <footer>
                Copyrights &copy; reserved to trekking management app,2026
            </footer>

        </div>

    </div>

</body>

</html>
