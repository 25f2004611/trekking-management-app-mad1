<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="../static/main.css">

</head>

<body>
    <header>
        <h2><u>Welcome to the Trekking Management Application</u></h2>
    </header>
    <div class="main">
        <form method="POST" action="{{url_for('register')}}">
            <table class="table-box">
                <caption>
                    <h3>Register</h3>
                </caption>
                <tr>

                    <td> <label for="fname">Enter your Name:</label></td>
                    <td><input type="text" placeholder="Enter your full name" id="fname" name="fname"></td>

                </tr>
               
                <tr>
                    <td><label for="phno">Enter your phone number:</label></td>
                    <td><input type="string" placeholder="Your phone number" id="phno" name="phno"></td>

                </tr>
                <tr>
                    <td><label for="email_id">Enter your E-mail:</label></td>
                    <td><input type="string" id="email_id" placeholder="Email Id" name="email"></td>

                </tr>
                <tr>
                    <td><label for="pwd">Enter Password:</label></td>
                    <td><input type="password" id="pwd" placeholder="Make a strong password" name="pwd"></td>

                </tr>
                 <tr>
                    <td><label for="address">Enter your address:</label></td>
                    <td><input type="text" id="address" name="address" placeholder="Enter your address"></td>

                </tr>
                <tr>
                    <td><label for="utype">Select a role :</label></td>
                    <td>
                        <select name="utype" id="utype">
                            <option value="1" selected>User</option>
                            <option value="2">Trek Staff</option>
                        </select>
                    </td>
                </tr>
            </table>
            <div id="button"><button type="submit">Register</button></div>
        </form>
        <br>
        <p>Already have an account? <a href="{{url_for('signin')}}">Login Here</a></p>


        <footer>Copyrights &copy; reserved to trekking management app,2026</footer>
    </div>
</body>

</html>
