<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Dashboard</title>

    <link rel="stylesheet" href="../static/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Welcome!</h2>

            <ul>
                <li><a href="{{url_for('staff_dash')}}"><i class="bi bi-house-fill"></i>Dashboard</a></li>
                <li><a href="{{url_for('staff_modify_trek')}}"><i class="bi bi-signpost-split-fill"></i>My Treks</a>
                </li>
                <li><a href="{{url_for('staff_participants')}}"><i class="bi bi-person-fill"></i>Participants</a></li>
                <li><a href="{{url_for('staff_profile')}}"><i class="bi bi-person-circle"></i>Profile</a></li>
                <li><a href="{{url_for('signin')}}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main">

            <header>
                <h2>Trekking Management Application</h2>
                <div class="admin">
                    <i class="bi bi-person-circle"></i>
                    <span>Staff</span>

                </div>
            </header>

            <h2 class="title"><u>My Profile</u></h2>
            <div class="row">
                        
                            <div class="col-md-6">
                                <div class="info-box">
                                    <div class="info-label">Full Name</div>
                                    <div class="info-value">
                                        {{staff.full_name}}
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="info-box">
                                    <div class="info-label">Email</div>
                                    <div class="info-value">
                                        {{staff.email_id}}
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="info-box">
                                    <div class="info-label">Phone Number</div>
                                    <div class="info-value">
                                        {{staff.phone_num}}
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="info-box">
                                    <div class="info-label">Address</div>
                                    <div class="info-value">
                                        {{staff.address}}
                                    </div>
                                </div>
                            </div>
                 

                        </div>

                <footer>
                    Copyrights &copy; reserved to trekking management app,2026
                </footer>

            </div>

        </div>

</body>

</html>
