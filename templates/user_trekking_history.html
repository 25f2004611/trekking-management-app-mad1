<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Trekking History</title>
    <link rel="stylesheet" href="../static/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Welcome!</h2>

            <ul>
                <li><a href="{{url_for('user_dash')}}"><i class="bi bi-house-fill"></i>Dashboard</a></li>
                <li><a href="{{url_for('user_trekking')}}"><i class="bi bi-signpost-split-fill"></i>Browse Treks</a></li>
                <li><a href="{{url_for('booking_details')}}"><i class="bi bi-calendar-check"></i>My Bookings</a></li>
                <li><a href="{{url_for('trek_history')}}"><i class="bi bi-clock-history"></i>History</a></li>
                <li><a href="{{url_for('user_profile')}}"><i class="bi bi-person-circle"></i>Profile</a></li>

            </ul>
        </div>

        <!-- Main Content -->
        <div class="main">

            <header>
                <h2>Trekking Management Application</h2>
                <div class="admin">
                    <i class="bi bi-person-circle"></i>
                    <span>User</span>

                </div>
            </header>

            
             <h3 class="title"><u>Trekking History</u></h2>

                <tr>
                    <th>Trek Name</th>

                </tr>

                    <td>Everest camp</td>

             </table>

            </footer>
            
        </div>
         
    </div>
