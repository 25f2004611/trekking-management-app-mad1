<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../static/main.css">
</head>

<body>

    <div class="main">

        <header>
            <h2><u>Welcome to the Trekking Management Application</u></h2>
        </header>


        <form method="POST" action="{{url_for('signin')}}">
            <table class="table-box">
                <caption>
                    <h3>Login</h3>
                </caption>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input id="email" type="string" placeholder="Enter your email" name="email"></td>
                </tr>
                <tr>
                    <td><label for="pwd">Password:</label></td>
                    <td><input id="pwd" type="password" placeholder="Enter your password" name="pwd"></td>
                </tr>
                <tr>
                    <td><label for="utype">Select a role :</label></td>
                    <td>
                        <select name="utype" id="utype">
                            <option value="0" selected>Admin</option>
                            <option value="1" selected>User</option>
                            <option value="2">Trek Staff</option>
                        </select>
                    </td>
                </tr>

            </table>
            <br>
            <div id="button"><button type="submit">Login</button></div>
        </form>
        <br>
        <p>Don't have an account? <a href="{{url_for('register')}}">Register Here</a></p>


        <footer>Copyrights &copy; reserved to trekking management app,2026</footer>
    </div>
</body>

</html>
