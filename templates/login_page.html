<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../static/main.css">

</head>

<body>
    
        <div class="main">

            <header>
            <h2><u>Welcome to the Trekking Management Application</u></h2>
            </header>

            <div class="input_form">
                <form>
                    <table>
                        <caption><h3>Login</h3></caption>
                        <tr>
                            <td><label for="email">Email:</label></td>
                            <td ><input id="email" type="string" placeholder="Enter your email"></td>
                        </tr>
                        <tr>
                            <td ><label for="pwd">Password:</label></td>
                            <td><input id="pwd" type="password" placeholder="Enter your password"></td>
                        </tr>

                    </table>
                    <br><div id="button"><button type="submit">Login</button></div>
                </form>
                <br><p>Don't have an account? <a href="{{url_for('register')}}">Register Here</a></p>
            </div>

                <footer>Copyrights &copy; reserved to trekking management app,2026</footer>
        </div>
</body>

</html>
