<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="../static/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container">

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Welcome!</h2>

            <ul>
                <li><a href="{{url_for('admin_dash')}}"><i class="bi bi-house-fill"></i> Dashboard</a></li>
                <li><a href="{{url_for('admin_mng_trek')}}"><i class="bi bi-signpost-split-fill"></i> Treks</a></li>
                <li><a href="{{url_for('admin_mng_staff')}}"><i class="bi bi-person-badge-fill"></i> Staff</a></li>
                <li><a href="{{url_for('admin_users')}}"><i class="bi bi-person-fill"></i>Users</a></li>
                <li><a href="{{url_for('admin_mng_bookings')}}"><i class="bi bi-calendar-check-fill"></i>Bookings</a></li>
                <li><a href="{{url_for('search')}}"><i class="bi bi-search"></i> Search</a></li>
                <li><a href="{{url_for('signin')}}"><i class="bi bi-box-arrow-right"></i> Logout</a></li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main">


            <header>
                <h2>Trekking Management Application</h2>
                <div class="admin">
                    <i class="bi bi-person-gear"></i>
                    <span>Admin</span>

                </div>

            </header>
            <h2 class="title"><u>Add New Trek</u></h2>

            <form method="POST" action="{{url_for('admin_modify')}}">

                <table>
                    <tr>
                        <td><label for="trek">Trek Name</label></td>
                        <td><input type="text" id="trek" name="trek_name"></td>
                    </tr>
                    <tr>
                        <td><label for="loc">location</label></td>
                        <td><input type="text" id="loc" name="location"></td>
                    </tr>
                    <tr>
                        <td><label for="dif">Difficulty</label></td>
                        <td><select name="difficulty" id="dif" >

                                <option value="0">Easy</option>
                                <option value="1">Moderate</option>
                                <option value="2">Hard</option>
                                <option value="none" selected>..select</option>

                            </select></td>
                    </tr>
                    <tr>
                        <td><label for="dur">Duration(in days)</label></td>
                        <td><input type="number" id="dur" name="duration"></td>
                    </tr>
                    <tr>
                        <td><label for="av_slot">Available slots</label></td>
                        <td><input type="number" id="av_slot" name="slot"></td>
                    </tr>


                    <tr>
                        <td><label for="st_date">Start Date</label></td>
                        <td><input type="date" id="st_date" placeholder="dd/mm/yyyy" name="start_date"></td>
                    </tr>
                    <tr>
                        <td><label for="end_date">End Date</label></td>
                        <td><input type="date" id="end_date" placeholder="dd/mm/yyyy" name="end_date"></td>
                    </tr>
                    <tr>
                        <td><label for="as_staff">Assign Staff</label></td>
                        <td><select name="assign" id="as_staff">
                            {% for staff in staff_list %}
                                <option value="{{staff.staff_id}}">{{staff.full_name}}</option>
                            {% endfor %}
                            </select></td>
                    </tr>
                    <tr>
                        <td><label for="status">Status</label></td>
                        <td><select name="stat" id="status">

                                <option value="1">Approved</option>
                                <option value="3">Completed</option>
                                <option value="0">Pending</option>
                                <option value="2">Open</option>
                                <option value="4">Closed</option>
                                <option value="none" selected>..select</option>

                            </select></td>
                    </tr>
                    <tr>
                        <td><label for="txtbox">Description</label></td>
                        <td><textarea name="description" id="txtbox" rows="5" cols="20"></textarea></td>
                    </tr>
                </table>
                <br>

                <button type="submit" class="btn btn-success">Save</button>
               
            </form>

            <!-- footer -->
            <footer>
                Copyrights &copy; reserved to trekking management app,2026
            </footer>

        </div>

    </div>

</body>

</html>
